name: AI Code Review Benchmark (Alibaba OCR vs PR-Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Alibaba Open Code Review (OCR)
  # ---------------------------------------------------------------------------
  alibaba-open-code-review:
    name: Alibaba Open Code Review (OCR)
    if: ${{ github.event_name == 'pull_request' && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Build
        run: |
          go version
          go build ./...

      - name: OpenCodeReview Action Step
        uses: alibaba/open-code-review@main
        with:
          llm_url: "https://generativelanguage.googleapis.com/v1beta/openai/v1"
          llm_auth_token: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.OPENAI_API_KEY }}
          llm_model: "gemini-2.5-flash"
          llm_use_anthropic: "false"
          language: "English"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: The-PR-Agent
  # ---------------------------------------------------------------------------
  the-pr-agent:
    name: Run PR-Agent
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR-Agent Action Step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
