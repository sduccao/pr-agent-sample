name: AI Code Review Benchmark (Alibaba OCR vs PR-Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Alibaba Open Code Review (OCR)
  # ---------------------------------------------------------------------------
  alibaba-open-code-review:
    name: Alibaba Open Code Review (OCR)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Build & Test
        run: |
          go version
          go test -v ./...

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Run Alibaba Open Code Review CLI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_KEY="${GEMINI_API_KEY:-$OPENAI_API_KEY}"
          if [ -z "$API_KEY" ]; then
            echo "::warning::Neither GEMINI_API_KEY nor OPENAI_API_KEY is configured in repository secrets."
            echo "To enable Alibaba OCR reviews, set GEMINI_API_KEY or OPENAI_API_KEY in GitHub secrets."
            exit 0
          fi

          export OPENAI_API_KEY="$API_KEY"
          if [ -n "$GEMINI_API_KEY" ]; then
            export OPENAI_BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai/"
            export OPENAI_MODEL="gemini-3.6-flash"
          fi

          echo "Installing @alibaba-group/open-code-review..."
          npm install -g @alibaba-group/open-code-review

          echo "Running Alibaba Open Code Review..."
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} || true
          ocr review --from origin/${{ github.base_ref }} --to HEAD

  # ---------------------------------------------------------------------------
  # Job 2: The-PR-Agent
  # ---------------------------------------------------------------------------
  the-pr-agent:
    name: The-PR-Agent Review
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret Availability
        id: check_keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$OPENAI_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::warning::Neither GEMINI_API_KEY nor OPENAI_KEY is configured in repository secrets."
          fi

      - name: Run The-PR-Agent Action
        if: steps.check_keys.outputs.has_key == 'true'
        uses: The-PR-Agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.OPENAI_KEY }}
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.OPENAI_KEY }}
          GEMINI.KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.MODEL: ${{ secrets.GEMINI_API_KEY && 'google/gemini-2.5-flash' || 'gpt-4o' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REVIEWER.REQUIRE_CANVAS_REVIEW: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Focus on Go concurrency, memory leaks, SQL injection, and line position drift accuracy."
