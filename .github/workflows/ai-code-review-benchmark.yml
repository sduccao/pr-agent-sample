name: AI Code Review Benchmark (Alibaba OCR vs PR-Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Alibaba Open Code Review (OCR)
  # ---------------------------------------------------------------------------
  alibaba-open-code-review:
    name: Alibaba Open Code Review (OCR)
    if: ${{ github.event_name == 'pull_request' && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Build
        run: |
          go version
          go build ./...

      # -----------------------------------------------------------------------
      # Groq LLM Setup (Gemini commented out due to HTTP 429 Rate Limit)
      # Gemini config:
      #   llm_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      #   llm_auth_token: ${{ secrets.GEMINI_API_KEY }}
      #   llm_model: "gemini-3.6-flash"
      # -----------------------------------------------------------------------
      - name: OpenCodeReview Action Step
        uses: alibaba/open-code-review@main
        with:
          llm_url: "https://api.groq.com/openai/v1"
          llm_auth_token: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY }}
          llm_model: "llama-3.3-70b-versatile"
          llm_use_anthropic: "false"
          llm_extra_body: "{}"
          language: "English"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job 2: The-PR-Agent
  # ---------------------------------------------------------------------------
  the-pr-agent:
    name: Run PR-Agent
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR-Agent Action Step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY }}
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY }}
          OPENAI_BASE_URL: "https://api.groq.com/openai/v1"
          PR_AGENT.MODEL: "groq/llama-3.3-70b-versatile"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize"]'
          PR_REVIEWER.REQUIRE_CANVAS_REVIEW: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Focus on Go concurrency, memory leaks, SQL injection, and line position drift accuracy."
