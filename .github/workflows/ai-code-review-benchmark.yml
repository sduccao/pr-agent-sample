name: AI Code Review Benchmark (Alibaba OCR vs PR-Agent)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Alibaba Open Code Review (OCR)
  # ---------------------------------------------------------------------------
  alibaba-open-code-review:
    name: Alibaba Open Code Review (OCR)
    if: ${{ github.event_name == 'pull_request' && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Build & Test
        run: |
          go version
          go test -v ./...

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Run Alibaba Open Code Review CLI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_KEY="${GEMINI_API_KEY:-$OPENAI_API_KEY}"
          if [ -z "$API_KEY" ]; then
            echo "::warning::Neither GEMINI_API_KEY, GEMINI_KEY nor OPENAI_API_KEY is configured in repository secrets."
            echo "To enable Alibaba OCR reviews, set GEMINI_API_KEY in GitHub secrets."
            exit 0
          fi

          export OPENAI_API_KEY="$API_KEY"
          export OPENAI_BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai/"
          export OPENAI_MODEL="gemini-3.6-flash"

          echo "Installing @alibaba-group/open-code-review..."
          npm install -g @alibaba-group/open-code-review

          echo "Running Alibaba Open Code Review..."
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} || true
          ocr review --from origin/${{ github.base_ref }} --to HEAD

  # ---------------------------------------------------------------------------
  # Job 2: The-PR-Agent
  # ---------------------------------------------------------------------------
  the-pr-agent:
    name: Run PR-Agent
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR-Agent Action Step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          OPENAI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.OPENAI_KEY }}
          PR_AGENT.MODEL: "gemini/gemini-3.6-flash"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize"]'
          PR_REVIEWER.REQUIRE_CANVAS_REVIEW: "false"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Focus on Go concurrency, memory leaks, SQL injection, and line position drift accuracy."
